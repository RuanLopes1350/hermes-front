<svg viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wordmark { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
  </style>
  <defs>
    <symbol id="mark-frame" viewBox="0 0 100 100">
      <path d="M26,22 L26,78 M74,22 L74,78" stroke="currentColor" stroke-width="9" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="mark-arrow" viewBox="0 0 100 100">
